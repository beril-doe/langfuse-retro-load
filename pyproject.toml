# Dependencies are declared here because the README already states a pinning
# requirement that nothing implemented. langfuse_hook_official.py reaches into
# `_otel_tracer` and `_create_observation_from_otel_span`, which are private and
# not part of the public SDK surface, so a major release may rename them without
# that counting as a breaking change. The failure mode is a hook that silently
# stops recording, which is the worst kind for a tool whose whole job is recording.
#
# Nothing here is packaged or installed as a library. These scripts are run directly
# on the BERDL pod. This file plus the committed uv.lock exist so that `uv sync`
# reproduces one known environment instead of whatever the pod happens to have.
#
# `pip install -e .` is deliberately not offered. With several top-level scripts and
# no package directory, setuptools flat-layout discovery fails rather than installing
# the dependencies, so suggesting it would send someone down a dead end. Use uv.
[project]
name = "langfuse-retro-load"
version = "0.1.0"
description = "Load already-completed Claude Code sessions into Langfuse, backdated to when they happened."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The range keeps a 5.x out. The committed uv.lock is what actually pins the 4.x,
    # because a range alone lets every `uv sync` resolve a different release and leaves
    # the private-internals version unrecorded, which is the thing this file exists to
    # prevent. Change the pin with `uv lock --upgrade-package langfuse`, never by hand.
    "langfuse>=4.0,<5",
    # retro_load.py reads a sibling .env without ever printing values.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only the artifact uploader needs these, and that code is not in this repo yet.
upload = ["httpx>=0.27"]

[tool.uv]
# This project is uv-managed. Use `uv add` / `uv sync` / `uv lock --upgrade-package`,
# never `pip install` or `uv pip install`.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The vendored hook is copied verbatim from Langfuse so it can be diffed against
# upstream. Linting it would invite edits that make that diff meaningless.
exclude = ["langfuse_hook_official.py"]

[tool.ruff.lint]
# Deliberately narrow. Ruff's default set reports 120 findings here, 51 of them
# `list` versus `typing.List`, and a linter whose output is mostly style is one
# people stop reading. These are the families that have actually produced defects
# in this repo or would hide one:
#   E9  syntax errors
#   F   undefined names, unused imports
#   B   likely bugs, such as a mutable default argument
#   PLW1510  subprocess.run without an explicit check, which silently ignores failure
#   DTZ  naive datetimes, which matters because this tool compares against a UTC date
#   S110/S112  try/except that swallows an exception with pass or continue
# Widening this is a separate decision, not something to do while fixing something else.
select = ["E9", "F", "B", "PLW1510", "DTZ", "S110", "S112"]
